<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playlist — Melodify</title>
    <link rel="stylesheet" href="style.css">
    <!-- Urutan penting: api -> player -> app -> script halaman. YouTube IFrame API dimuat oleh player.js -->
    <script src="js/api.js" defer></script>
    <script src="js/player.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/playlists.js" defer></script>
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8z"/><path d="M5 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5l4.5 2.5-4.5 2.5z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
</svg>

<div class="app">
    <div class="panel">

        <!-- ===== SIDEBAR (sama di semua halaman) ===== -->
        <aside class="sidebar">
            <div class="side-title">
                <h2>Melodify</h2>
                <p>Library</p>
            </div>

            <nav class="nav" aria-label="Menu utama">
                <a href="index.html"><svg class="icon"><use href="#i-home"/></svg><span>Beranda</span></a>
                <a href="songs.html"><svg class="icon"><use href="#i-music"/></svg><span>Lagu</span></a>
                <a href="playlists.html" class="active" aria-current="page"><svg class="icon"><use href="#i-list"/></svg><span>Playlist</span></a>
            </nav>

            <p class="side-label">Playlist kamu</p>
            <nav class="nav side-playlists" aria-label="Playlist">
                <span class="nav-items" id="side-playlist-items"></span>
                <a href="playlists.html"><svg class="icon"><use href="#i-plus"/></svg><span>Buat playlist</span></a>
            </nav>
        </aside>

        <!-- ===== KONTEN HALAMAN ===== -->
        <main class="content">
            <header class="page-head">
                <div>
                    <h1>Playlist</h1>
                    <p id="playlist-count">Memuat playlist...</p>
                </div>
                <form class="search" action="songs.html" method="get" role="search">
                    <svg class="icon"><use href="#i-search"/></svg>
                    <input type="search" name="q" value="" placeholder="Cari lagu atau artis" aria-label="Cari lagu atau artis">
                </form>
            </header>
            <section class="section">
                <div class="section-head"><h2>Buat playlist baru</h2></div>
                <form id="create-playlist-form" class="create-form">
                    <input type="text" id="playlist-name" placeholder="Nama playlist" maxlength="150" required aria-label="Nama playlist">
                    <input type="text" id="playlist-description" placeholder="Deskripsi (opsional)" aria-label="Deskripsi playlist">
                    <button type="submit" class="btn primary"><svg class="icon"><use href="#i-plus"/></svg>Buat Playlist</button>
                </form>
            </section>

            <section class="section">
                <div class="section-head"><h2>Playlist saya</h2></div>
                <div class="grid" id="playlist-list" aria-live="polite"></div>
            </section>
        </main>
    </div>

    <!-- ===== PEMUTAR (sama di semua halaman) ===== -->
    <footer class="player" aria-label="Pemutar musik">
        <div class="p-info">
            <span class="thumb g1" id="player-thumbnail" role="img" aria-label="Sampul lagu"></span>
            <div class="p-text"><strong id="player-title">Belum ada lagu</strong><span id="player-artist">Pilih lagu untuk diputar</span></div>
        </div>
        <div class="p-center">
            <div class="p-controls">
                <button class="icon-btn" id="player-prev-btn" type="button" aria-label="Sebelumnya"><svg class="icon fill"><use href="#i-prev"/></svg></button>
                <button class="icon-btn play" id="player-play-btn" type="button" aria-label="Putar"><svg class="icon fill"><use href="#i-play"/></svg></button>
                <button class="icon-btn" id="player-next-btn" type="button" aria-label="Berikutnya"><svg class="icon fill"><use href="#i-next"/></svg></button>
            </div>
            <div class="p-progress">
                <span id="player-current-time">0:00</span>
                <input type="range" class="range" id="player-progress" min="0" max="100" step="0.1" value="0" style="--value:0%" aria-label="Progres lagu">
                <span id="player-duration">0:00</span>
            </div>
        </div>
        <div class="p-vol">
            <button class="icon-btn" id="player-video-btn" type="button" aria-label="Tampilkan video" aria-pressed="false"><svg class="icon"><use href="#i-video"/></svg></button>
            <svg class="icon vol-icon"><use href="#i-volume"/></svg>
            <input type="range" class="range" id="player-volume" min="0" max="100" value="70" style="--value:70%" aria-label="Volume">
        </div>
    </footer>

    <!-- Video YouTube (IFrame API). Ukuran 356x200 memenuhi syarat minimal YouTube. -->
    <div class="video-dock is-hidden" id="video-dock">
        <div id="youtube-player"></div>
    </div>
</div>
</body>
</html>
