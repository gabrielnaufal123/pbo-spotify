<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lagu — Melodify</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="/js/api.js"></script>
<script src="/js/player.js"></script>
<script src="/js/app.js"></script>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8z"/><path d="M5 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
</svg>

<div class="app">
    <div class="panel">

        <!-- ===== SIDEBAR (sama di semua halaman) ===== -->
        <aside class="sidebar">
            <div class="side-title">
                <h2>Melodify</h2>
                <p>Library</p>
            </div>

            <nav class="nav" aria-label="Menu utama">
                <a href="index.html"><svg class="icon"><use href="#i-home"/></svg><span>Beranda</span></a>
                <a href="songs.html" class="active" aria-current="page"><svg class="icon"><use href="#i-music"/></svg><span>Lagu</span></a>
                <a href="playlists.html"><svg class="icon"><use href="#i-list"/></svg><span>Playlist</span></a>
            </nav>

            <p class="side-label">Playlist kamu</p>
            <nav class="nav side-playlists" aria-label="Playlist">
                <a href="playlistdtl.html"><span class="mini g4"></span><span>Good Vibes Only</span></a>
                <a href="playlistdtl.html"><span class="mini g2"></span><span>Indie Anthems</span></a>
                <a href="playlists.html"><svg class="icon"><use href="#i-plus"/></svg><span>Buat playlist</span></a>
            </nav>
        </aside>

        <!-- ===== KONTEN HALAMAN ===== -->
        <main class="content">
            <header class="page-head">
                <div>
                    <h1>Lagu</h1>
                    <p id="song-count">Memuat lagu...</p>
                </div>
                <form id="search-form" class="search" role="search">
                    <svg class="icon">
                        <use href="#i-search"/>
                    </svg>

                    <input
                            type="search"
                            id="search-input"
                            name="q"
                            placeholder="Cari lagu atau artis di YouTube..."
                            aria-label="Cari lagu atau artis"
                    >

                    <button type="submit" aria-label="Cari lagu">
                        Cari
                    </button>
                </form>
            </header>

            <section class="songs-section">

                <h2>Hasil Pencarian</h2>

                <div id="search-results" class="song-results">
                    <p>Cari lagu favoritmu melalui kolom pencarian.</p>
                </div>

            </section>

            <p class="empty" id="empty-state" hidden>Tidak ada lagu yang cocok dengan pencarian.</p>
        </main>
    </div>

    <!-- ===== PEMUTAR (sama di semua halaman) ===== -->

    <!-- ===== PEMUTAR MUSIK ===== -->

    <footer class="player" aria-label="Pemutar musik">

        <!-- Informasi lagu -->
        <div class="p-info">

                <div class="p-info">
                    <!-- Thumbnail, judul, dan artis -->
                </div>

                <div class="youtube-embed">
                    <div id="youtube-player"></div>
                </div>

            <div class="p-text">

                <strong id="player-title">
                    Belum ada lagu
                </strong>

                <span id="player-artist">
                Melodify
            </span>

            </div>

        </div>

        <!-- Kontrol player -->
        <div class="p-center">

            <div class="p-controls">

                <button
                        id="player-prev-btn"
                        class="icon-btn"
                        type="button"
                        aria-label="Sebelumnya"
                >
                    <svg class="icon fill">
                        <use href="#i-prev"/>
                    </svg>
                </button>

                <button
                        id="player-play-btn"
                        class="icon-btn play"
                        type="button"
                        aria-label="Putar"
                >
                    ▶
                </button>

                <button
                        id="player-next-btn"
                        class="icon-btn"
                        type="button"
                        aria-label="Berikutnya"
                >
                    <svg class="icon fill">
                        <use href="#i-next"/>
                    </svg>
                </button>

            </div>

            <!-- Progress lagu -->
            <div class="p-progress">

                <span id="player-current-time">0:00</span>

                <input
                        id="player-progress"
                        type="range"
                        class="range"
                        min="0"
                        max="100"
                        value="0"
                        aria-label="Progres lagu"
                >

                <span id="player-duration">0:00</span>

            </div>

        </div>

        <!-- Volume -->
        <div class="p-vol">

            <svg class="icon">
                <use href="#i-volume"/>
            </svg>

            <input
                    id="player-volume"
                    type="range"
                    class="range"
                    min="0"
                    max="100"
                    value="70"
                    aria-label="Volume"
            >

        </div>

    </footer>

</div>

<!-- JavaScript ditambahkan di Tahap 4 dan 5 -->
</body>
</html>
